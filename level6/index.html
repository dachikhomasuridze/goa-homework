<h1>კომპიტერი</h1>

<p>კომპიუტერი ძალიან სასარგებლოა ინფორმაციებისათვის.</p>
<p>კომპიუტერში ტექნოლოგიის ნაწილია.</p>
<p>მისი დახმარებით შეგვიძლია კონკრეტული რამის სწავლა.</p>
<p>ასევე შეგვიძლია ვიდეოების ყურება.</p>
<p>კიდევ კომპიუტერში ვსწავლობთ პროკრამებს.</p>
<p>მას აქვს კლავიატურა.</p>
<p>მას აქვს მაუსი.</p>
<p>მე მიყვარს კომპიუტერი.</p>
